name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# A pull request pushed to twice in quick succession does not need the first
# run's answer any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository. `release.yml` asks for `contents:
# write` because it publishes; this only reads.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test and lint
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Use stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Cache cargo registry and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # `--locked` everywhere, matching the release build: the point of
      # committing Cargo.lock is that CI exercises the dependency tree that
      # actually ships. A run that quietly resolved something newer would be
      # testing something else.
      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
