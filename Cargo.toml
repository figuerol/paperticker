[workspace]
resolver = "2"
members = [
    "crates/ticker-proto",
    "crates/ticker-client",
    "crates/tickerd",
    "crates/tickerc",
    "crates/tickerctl",
]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
ticker-proto = { path = "crates/ticker-proto" }
ticker-client = { path = "crates/ticker-client" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# Production profile: link-time optimization + symbol stripping for a smaller,
# faster binary. Builds are slower but you only pay that once per release.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
